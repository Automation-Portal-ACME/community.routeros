- name: Run all EE tests
  hosts: localhost
  tasks:
    ---\n\n- name: Find all roles\n  ansible.builtin.find:\n    paths:\n      - "{{ (playbook_dir | default('.')) ~ '/roles' }}"
        file_type: directory\n    depth: 1\n  register: result\n\n- name: Include all roles\n  ansible.builtin.include_role:\n    name: "{{ item['path'] | regex_replace('^.*/', '') }}"
      loop: "{{ result.files | map(attribute='path') | sort }}"
    - name: Include all roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ result.files | map(attribute='path') | map('regex_replace', '.*/', '') | sort }}"
